spring.datasource.url=jdbc:postgresql://localhost:5432/rest_with_spring_boot_erudio
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.flyway.locations=classpath:static/db/migration
spring.flyway.url=jdbc:postgresql://localhost:5432/rest_with_spring_boot_erudio
spring.flyway.user=postgres
spring.flyway.password=postgres
